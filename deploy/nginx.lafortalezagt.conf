# Configuración de nginx para lafortalezagt.com (VPS Hostinger, Ubuntu 24.04).
# Instalar en el servidor como /etc/nginx/sites-available/lafortalezagt.com
# y habilitar con un symlink en sites-enabled (ver README de deploy).
#
# Certbot agrega automáticamente los bloques/listen SSL y el redirect
# http->https la primera vez que corrés `certbot --nginx`. Esta versión ya
# incluye, a mano, la redirección www -> apex a nivel HTTPS (Certbot no la
# genera solo) para que Google indexe una única URL canónica.

server {
    server_name www.lafortalezagt.com;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/lafortalezagt.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/lafortalezagt.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    return 301 https://lafortalezagt.com$request_uri;
}
# NOTA: `ipv6only=on` solo puede declararse UNA vez por combinación IP:puerto
# en todo nginx -- por eso el bloque de abajo usa "listen [::]:443 ssl;" sin
# ipv6only (ya quedó fijado por el bloque de arriba, que se carga primero).

server {
    server_name lafortalezagt.com;

    root /var/www/lafortaleza;
    index index.html;

    # SPA con rutas prerenderizadas: si existe una carpeta con index.html
    # propio (ej. /servicios/index.html) la sirve; si no, cae al index.html
    # raíz y React Router toma el control en el cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/lafortalezagt.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/lafortalezagt.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = www.lafortalezagt.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = lafortalezagt.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name lafortalezagt.com www.lafortalezagt.com;
    return 404; # managed by Certbot
}
